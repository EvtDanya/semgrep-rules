name: Validate Semgrep Rules

on:
  pull_request:
    branches:
      - main

jobs:
  validate-and-test:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install semgrep + deps
        run: pip3 install semgrep jsonschema pyyaml

      - name: Get changed rule files
        id: changed
        run: |
          CHANGED=$(git diff --name-only --diff-filter=ACMRT \
            origin/${{ github.base_ref }} ${{ github.sha }} \
            | grep -E "\.ya?ml$" \
            | grep -v "\.test\.ya?ml$" \
            | grep -v "^\.github/" \
            | tr '\n' ' ')
          echo "files=$CHANGED" >> $GITHUB_OUTPUT
          echo "Changed rule files: $CHANGED"

      - name: Validate rules
        if: steps.changed.outputs.files != ''
        run: |
          echo "## Validation" >> $GITHUB_STEP_SUMMARY
          OUTPUT=$(semgrep validate ${{ steps.changed.outputs.files }} 2>&1) || true
          echo "$OUTPUT" | tee -a $GITHUB_STEP_SUMMARY
          if echo "$OUTPUT" | grep -qiE "(warning|invalid rule|skippable error|unknown field)"; then
            echo "Validation found warnings or errors" | tee -a $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "[INFO] Validation passed" | tee -a $GITHUB_STEP_SUMMARY

      - name: Validate metadata
        if: steps.changed.outputs.files != ''
        run: |
          set -o pipefail
          echo "## Metadata Validation" >> $GITHUB_STEP_SUMMARY
          python3 .github/scripts/validate-metadata.py \
            --schema .github/metadata-schema.yaml.schm \
            --config ${{ steps.changed.outputs.files }} 2>&1 | tee -a $GITHUB_STEP_SUMMARY

      - name: Run tests
        if: steps.changed.outputs.files != ''
        shell: bash
        run: |
          set -o pipefail
          echo "## Tests" >> $GITHUB_STEP_SUMMARY
          semgrep --test \
            --exclude ".github" \
            . 2>&1 | tee -a $GITHUB_STEP_SUMMARY