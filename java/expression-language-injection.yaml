rules:
- id: expression-language-injection
  message: |
    Expression Language injection vulnerability detected. User input is being evaluated as an EL expression without proper sanitization.
  severity: ERROR
  languages: [java]
  mode: taint
  pattern-sources:
    - patterns:
      - pattern-either:
        - pattern: $REQ.getParameter($PARAM)
        - pattern: $REQ.getHeader($HEADER)
        - pattern: |
            @RequestParam $TYPE $VAR
        - pattern: |
            @PathVariable $TYPE $VAR
  pattern-sinks:
    - patterns:
      - pattern-either:
        - pattern: $CTX.evaluateExpressionGet($TAINTED, ...)
        - pattern: $PROCESSOR.eval($TAINTED)
        - pattern: ExpressionFactory.createValueExpression($TAINTED, ...)
        - pattern: |
            "#{" + $TAINTED + "}"
        - pattern: |
            "${" + $TAINTED + "}"
        - pattern: $PARSER.parseExpression($TAINTED)
  pattern-sanitizers:
    - pattern: sanitizeELExpression($INPUT)
    - pattern: escapeELSpecialChars($INPUT)
  metadata:
    cwe: "CWE-094: Improper Control of Generation of Code"
    owasp: "A03:2021 - Injection"
  references:
    - "https://www.exploit-db.com/docs/english/48303-remote-code-execution-with-el-injection-vulnerabilities.pdf"
