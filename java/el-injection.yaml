rules:
- id: el-injection-spring-spel
  message: |
    Spring Expression Language (SpEL) injection vulnerability. Can lead to remote code execution via T() operator.
  severity: ERROR
  languages: [java]
  mode: taint
  pattern-sources:
    - patterns:
      - pattern-either:
        - pattern: $REQ.getParameter($PARAM)
        - pattern: |
            @RequestParam $TYPE $VAR
  pattern-sinks:
    - patterns:
      - pattern-either:
        - pattern: $PARSER.parseExpression($TAINTED)
        - pattern: $REQ.getExpressionParser().parseExpression($TAINTED)
        - pattern: $EXPRESSION_FACTORY.createValueExpression($TAINTED, ...)

- id: jsf-el-injection
  message: |
    JSF Expression Language injection in evaluateExpressionGet(). User input is directly evaluated as EL expression.
  severity: ERROR
  languages: [java]
  mode: taint
  pattern-sources:
    - pattern: $REQ.getParameter($PARAM)
  pattern-sinks:
    - pattern: $APP.evaluateExpressionGet($CTX, "#{" + $TAINTED + "}", ...)