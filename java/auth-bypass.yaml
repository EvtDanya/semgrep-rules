rules:
- id: spring-auth-bypass-path-traversal
  message: |
    Path traversal vulnerability in Spring Security mapping. Attackers can bypass authentication using '../' sequences.
  severity: ERROR
  languages: [java]
  patterns:
    - pattern-either:
      - pattern: |
          @RequestMapping(value = $PATH)
          $TYPE $METHOD(...) { ... }
      - pattern: |
          @GetMapping($PATH)
          $TYPE $METHOD(...) { ... }
      - metavariable-pattern:
          metavariable: $PATH
          patterns:
            - pattern-either:
              - pattern-regex: '.*\.\./.*'
              - pattern-regex: '.*/\*.*'
              - pattern-regex: '.*\[\.\.\].*\.\./.*'

- id: missing-method-security
  message: |
    Missing @PreAuthorize or @Secured annotation on sensitive method This could allow unauthorized access.
  severity: HIGH
  languages: [java]
  patterns:
    - pattern: |
        @$MAPPING(...)
        public $TYPE $METHOD(...) {
          ...
          $SERVICE.delete$SOMETHING(...)
          ...
        }
    - pattern-not-inside: |
        @PreAuthorize(...)
        @$MAPPING(...)
        public $TYPE $METHOD(...) { ... }
    - pattern-not-inside: |
        @Secured(...)
        @$MAPPING(...)
        public $TYPE $METHOD(...) { ... }