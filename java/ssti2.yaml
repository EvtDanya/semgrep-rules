rules:
  - id: freemarker-ssti-model-injection
    message: |
      FreeMarker Server-Side Template Injection (SSTI). User input in template model can lead to code execution via ObjectConstructor.
    severity: ERROR
    languages: [java]
    mode: taint
    pattern-sources:
      - pattern: $REQ.getParameter($PARAM)
    pattern-sinks:
      - patterns:
        - pattern: $MODEL.addAttribute($KEY, $TAINTED)
        - pattern: $MODEL.put($KEY, $TAINTED)

  - id: freemarker-unsafe-configuration
    message: |
      Insecure FreeMarker configuration. ObjectConstructor access enabled, allowing template injection attacks.
    severity: HIGH
    languages: [java]
    patterns:
      - pattern-not: |
          $CONFIG.setClassResolver(TemplateClassResolver.ALLOWS_NOTHING_RESOLVER)
      - pattern-inside: |
          freemarker.template.Configuration $CONFIG = ...